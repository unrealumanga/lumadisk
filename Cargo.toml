[package]
name = "lumadisk"
version = "0.1.1"
edition = "2024"
description = "Fast, private disk space analyzer with a treemap heatmap and duplicate finder"
license = "MIT"
repository = "https://github.com/unrealumanga/lumadisk"
homepage = "https://github.com/unrealumanga/lumadisk"
readme = "README.md"
keywords = ["disk-usage", "treemap", "duplicate-files", "file-manager", "storage"]
categories = ["filesystem", "visualization", "gui"]

[dependencies]
blake3 = "1.8.5"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
jwalk = "0.8.1"
rayon = "1.12.0"
rfd = "0.17.2"
showfile = "0.1.1"
trash = "5.2.6"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
