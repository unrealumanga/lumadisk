name: Cross-platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: lumadisk-windows-x64
            package: dist/lumadisk-windows-x64.zip
          - name: Linux x64
            os: ubuntu-24.04
            artifact: lumadisk-linux-x64
            package: dist/lumadisk-linux-x64.tar.gz
          - name: macOS Apple Silicon
            os: macos-15
            artifact: lumadisk-macos-arm64
            package: dist/lumadisk-macos-arm64.app.zip
          - name: macOS Intel
            os: macos-15-intel
            artifact: lumadisk-macos-x64
            package: dist/lumadisk-macos-x64.app.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/lumadisk.exe -DestinationPath '${{ matrix.package }}'
          (Get-FileHash '${{ matrix.package }}' -Algorithm SHA256).Hash | Set-Content '${{ matrix.package }}.sha256'

      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -C target/release -czf '${{ matrix.package }}' lumadisk
          sha256sum '${{ matrix.package }}' > '${{ matrix.package }}.sha256'

      - name: Create macOS app bundle
        if: runner.os == 'macOS'
        env:
          PACKAGE_PATH: ${{ matrix.package }}
        run: |
          mkdir -p dist/LumaDisk.app/Contents/MacOS
          cp target/release/lumadisk dist/LumaDisk.app/Contents/MacOS/LumaDisk
          chmod +x dist/LumaDisk.app/Contents/MacOS/LumaDisk
          cat > dist/LumaDisk.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key><string>LumaDisk</string>
            <key>CFBundleExecutable</key><string>LumaDisk</string>
            <key>CFBundleIdentifier</key><string>com.lumadisk.app</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>LumaDisk</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.1</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          ditto -c -k --sequesterRsrc --keepParent dist/LumaDisk.app "$PACKAGE_PATH"
          shasum -a 256 "$PACKAGE_PATH" > "$PACKAGE_PATH.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.package }}
            ${{ matrix.package }}.sha256
          if-no-files-found: error
